[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "everwillow"
description = "Statistical inference steps for high-energy physics analyses with JAX."
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]  # version is set in src/everwillow/__init__.py
authors = [
    { name = "MoAly98", email = "ma2520@princeton.edu" },
    { name = "pfackeldey", email = "peter.fackeldey@princeton.edu" },
    { name = "maxgalli", email = "mg2708@princeton.edu" },
]
keywords = ["jax", "statistics", "inference", "hep", "physics", "fitting", "hypothesis-testing"]
dependencies = [
    "jax>=0.7.2",
    "optimistix>=0.0.10",
    "jaxtyping>=0.2.34",
    "equinox>=0.10.11", # dep of optimistix but we make it explicit
    "orbax-checkpoint>=0.6.0",
    "treescope>=0.1.0",
    "tqdm>=4.60", # for interactive fitting progress bars
]


[dependency-groups]
test = ["pytest >=9", "pytest-cov >=3", "coverage[toml]"]
docs = [
    "sphinx>=7",
    "sphinx-book-theme",
    "myst-parser<6",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "myst-nb>=1.4",
    "sphinxcontrib-mermaid",
]
examples = [
    "pyhs3",
    "evermore>=0.4.1",
    "pyhf",
    "rich",
    "iminuit>=2.32.0",
    "scipy>=1.16.3",
    "matplotlib>=3.10.8",
    "paramore",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ipython",
    "ruff",
    "pre_commit",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/MoAly98/everwillow"
"Bug Tracker" = "https://github.com/MoAly98/everwillow/issues"
Discussions = "https://github.com/MoAly98/everwillow/discussions"
Changelog = "https://github.com/MoAly98/everwillow/releases"


[tool.hatch]
version.path = "src/everwillow/__init__.py"


[tool.pytest.ini_options]
minversion = "7"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning", # <- remove once equinox publishes a new release (see: https://github.com/patrick-kidger/equinox/commit/5a5bf287f73032201c34ff2c73e73573f8232739)
]
log_cli_level = "INFO"
testpaths = ["tests"]


[tool.coverage]
run.source = ["everwillow"]
run.omit = [
    "src/everwillow/callback.py",
    "src/everwillow/fitting.py",
    "src/everwillow/uncertainty.py",
    "src/everwillow/util.py",
    "src/everwillow/hypotest/*.py",
    "src/everwillow/statelib/*.py",
    "src/everwillow/parameters/*.py",
]
report.exclude_lines = ['pragma: no cover', '\.\.\.', 'if typing.TYPE_CHECKING:']


[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = false
ignore_missing_imports = true


[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
ignore = [
    "PLR",     # Design related pylint codes
    "ISC001",  # flake8-implicit-str-concat: Implicit string concatenation
    "PLW3201", # Dunder method has no special meaning in Python 3 (treescope uses __treescope_repr__)
    "RUF002",  # Ambiguous Unicode characters in docstrings (Greek letters are standard in physics)
    "RUF003",  # Ambiguous Unicode characters in comments (Greek letters are standard in physics)
    "F722",    # jaxtyping: `Float32[Array, "b c"]` (https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error)
    "UP040",   # PEP 695 type alias syntax (https://peps.python.org/pep-0695/)
    "UP046",   # PEP 695 generic class syntax
    "UP047",   # PEP 695 generic function syntax
]
select = [
    "E",
    "F",
    "W",    # flake8
    "B",    # flake8-bugbear
    "I",    # isort
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "EXE",  # flake8-executable
    "E303", # Too many blank lines
]
unfixable = [
    "F841", # Would remove unused variables
]
per-file-ignores."src/everwillow/*.py" = ["PLC0414", "RUF022"]
per-file-ignores."src/everwillow/hypotest/*.py" = ["PLC0414", "RUF022"]
per-file-ignores."src/everwillow/statelib/*.py" = ["PLC0414", "RUF022"]
per-file-ignores."src/everwillow/_src/statelib/state.py" = ["PLC0415"]  # try/except IPython detection
per-file-ignores."src/everwillow/parameters/*.py" = ["PLC0414", "RUF022"]
per-file-ignores."examples/**/*.py" = ["PLC0415", "E501"]
per-file-ignores."tests/**/*.py" = ["PLC0415", "EM101", "SIM108", "PLC2701"]  # tests import _src directly by convention
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]

[tool.uv.sources]
pyhs3 = { git = "https://github.com/MoAly98/pyhs3", branch = "fix/funcs_ref_funcs" }
pyhf = { git = "https://github.com/scikit-hep/pyhf", branch = "main" }
paramore = { git = "https://github.com/maxgalli/paramore", branch = "feat/bernstein-analytical-integrate" }
